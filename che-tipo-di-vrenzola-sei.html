  .progress{height:14px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden;margin-bottom:18px;border:1px solid var(--giallo);}

  .qnum{font-size:.85rem;letter-spacing:2px;opacity:.8;text-transform:uppercase;margin-bottom:6px;}
  .question{font-size:1.4rem;font-weight:bold;margin-bottom:18px;line-height:1.25;}
  .opt{display:block;width:100%;text-align:left;margin-bottom:12px;padding:14px 16px;font-size:1.02rem;cursor:pointer;color:#fff;background:rgba(255,255,255,.08);border:2px solid rgba(255,212,0,.5);border-radius:14px;transition:all .12s;}

  .result-title{font-size:2rem;text-align:center;color:var(--giallo);margin:6px 0 14px;text-shadow:0 0 12px var(--rosa);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fadeIn .18s ease;}

  .modal-title{font-size:1.6rem;text-align:center;color:var(--giallo);margin-bottom:12px;text-shadow:0 0 10px var(--rosa);}
  .modal-desc{font-size:1rem;line-height:1.6;margin-bottom:12px;opacity:.95;}
  .modal-box .result-box{margin-bottom:8px;}
  .modal-close{display:block;width:100%;margin-top:16px;padding:12px;font-size:.95rem;font-weight:bold;cursor:pointer;border:2px solid var(--rosa);border-radius:12px;background:transparent;color:var(--rosa);transition:all .12s;}
  .modal-close:hover{background:var(--rosa);color:#fff;}
</style>
</head>

let idx=0;
const punti={classica:0,tronista:0,neomelodica:0,imprenditrice:0,regina:0,tamarra:0,antonella:0,fitness:0};

function start(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  render();
}
function shuffle(arr){
  const copy=[...arr];
  for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}
  return copy;
}
function render(){
  const d=DOMANDE[idx];
  document.getElementById('bar').style.width=((idx)/DOMANDE.length*100)+'%';
  document.getElementById('qnum').textContent="Domanda "+(idx+1)+" di "+DOMANDE.length;
  document.getElementById('qtext').textContent=d.q;
  const box=document.getElementById('opts');
  box.innerHTML='';
  shuffle(d.a).forEach(o=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=o.t;b.onclick=()=>pick(o.k);
    box.appendChild(b);
  });
}
function pick(k){
  punti[k]++;idx++;
  if(idx<DOMANDE.length){render();}else{showResult();}
}
function showResult(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  let max=Math.max(...Object.values(punti));
  let winner=Object.keys(punti).filter(k=>punti[k]===max);
  winner=winner[Math.floor(Math.random()*winner.length)];
  const r=TIPI[winner];
  document.getElementById('rEmoji').textContent=r.emoji;
  document.getElementById('rTitle').textContent=r.title;
  document.getElementById('rDesc').textContent=r.desc;
  document.getElementById('rHabitat').innerHTML=r.habitat;
  document.getElementById('rFrase').innerHTML=r.frase;
  document.getElementById('rArma').innerHTML=r.arma;
  document.getElementById('bar').style.width='100%';
}
function toggleBreakdown(btn){
  const panel=document.getElementById('breakdown');
  const open=!panel.classList.contains('hidden');
  panel.classList.toggle('hidden');
  btn.textContent=open?"🔍 Vide quant'è di ogni tipo in te ↓":"🔼 Nasconni 'a composizione";
  if(!open&&!panel.dataset.built){buildBreakdown();panel.dataset.built='1';}
}
function buildBreakdown(){
  const total=Object.values(punti).reduce((a,b)=>a+b,0);
  const panel=document.getElementById('breakdown');
  const sorted=Object.entries(punti).sort((a,b)=>b[1]-a[1]);
  panel.innerHTML=sorted.map(([k,v])=>{
    const pct=total>0?Math.round(v/total*100):0;
    const t=TIPI[k];
    return `<div class="bk-row" onclick="openModal('${k}')">
      <div class="bk-label"><span class="bk-name">${t.emoji} ${t.title}</span><span class="bk-pct">${pct}%</span></div>
      <div class="bk-track"><div class="bk-fill" data-pct="${pct}"></div></div>
      <div class="bk-hint">toccame p' 'e dettagli 👆</div>
    </div>`;
  }).join('');
  setTimeout(()=>{panel.querySelectorAll('.bk-fill').forEach(el=>{el.style.width=el.dataset.pct+'%';});},50);
}
function openModal(k){
  const t=TIPI[k];
  document.getElementById('mEmoji').textContent=t.emoji;
  document.getElementById('mTitle').textContent=t.title;
  document.getElementById('mDesc').textContent=t.desc;
  document.getElementById('mHabitat').innerHTML=t.habitat;
  document.getElementById('mFrase').innerHTML=t.frase;
  document.getElementById('mArma').innerHTML=t.arma;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(e){
  if(e.target===document.getElementById('modal'))
    document.getElementById('modal').classList.add('hidden');
}
</script>
